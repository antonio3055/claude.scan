name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build + test:suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Forge-Scanner-React-018-Live-Grid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Forge-Scanner-React-018-Live-Grid/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run all test suites
        run: npm run test:suites
